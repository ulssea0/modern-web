<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox and Grid</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .menu { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 24px; background: #1f2937; color: white; }
    .menu ul { display: flex; gap: 16px; list-style: none; margin: 0; padding: 0; }
    .menu a { color: white; text-decoration: none; }
    .layout { display: grid; grid-template-columns: 180px 1fr; grid-template-rows: 70px 1fr 60px; gap: 10px; min-height: 400px; padding: 10px; }
    header, aside, main, footer { padding: 20px; color: white; }
    header { grid-column: 1 / 3; background: #2563eb; }
    aside { background: #0f766e; }
    main { background: #7c3aed; }
    footer { grid-column: 1 / 3; background: #374151; }
  </style>
</head>
<body>
  <nav class="menu"><strong>MyLogo</strong><ul><li><a href="#">Home</a></li><li><a href="#">About</a></li><li><a href="#">Contact</a></li></ul></nav>
  <section class="layout">
    <header>Header</header><aside>Sidebar</aside><main>Main Content</main><footer>Footer</footer>
  </section>
</body>
</html>
