<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Model and Display</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; }
    .box { width: 220px; padding: 20px; border: 4px solid #2563eb; margin: 12px 0; background: #dbeafe; }
    .inline { display: inline; background: #fecaca; padding: 6px; }
    .inline-block { display: inline-block; width: 120px; padding: 20px; margin: 8px; background: #bbf7d0; }
    .hidden { visibility: hidden; }
  </style>
</head>
<body>
  <h1>Box Model และ Display</h1>
  <div class="box">Content + Padding + Border + Margin</div>
  <p><span class="inline">inline 1</span> <span class="inline">inline 2</span></p>
  <div class="inline-block">inline-block A</div><div class="inline-block">inline-block B</div>
  <p class="hidden">ข้อความนี้ถูกซ่อน แต่ยังคงพื้นที่ในหน้าเว็บ</p>
</body>
</html>
