<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather API</title>
</head>
<body>
  <h1>สภาพอากาศ: อำเภอดอยสะเก็ด</h1>
  <button id="loadWeather">โหลดสภาพอากาศ</button>
  <pre id="result"></pre>
  <script>
    const button = document.getElementById("loadWeather");
    const result = document.getElementById("result");

    button.addEventListener("click", async () => {
      const url = "https://api.open-meteo.com/v1/forecast?latitude=18.878&longitude=99.136&current=temperature_2m,relative_humidity_2m,wind_speed_10m";
      result.textContent = "กำลังโหลด...";
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const weather = data.current;
        result.textContent = `อุณหภูมิ: ${weather.temperature_2m} °C\nความชื้น: ${weather.relative_humidity_2m} %\nความเร็วลม: ${weather.wind_speed_10m} km/h\nเวลา: ${weather.time}`;
      } catch (error) {
        result.textContent = `เกิดข้อผิดพลาด: ${error.message}`;
      }
    });
  </script>
</body>
</html>
