<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text, Lists, Links and Images</title>
</head>
<body>
  <h1>HTML พื้นฐาน</h1>
  <p>HTML ใช้สร้าง <strong>โครงสร้าง</strong> ของเว็บไซต์<br>และใช้ <em>แท็ก</em> เพื่อกำหนดชนิดเนื้อหา</p>

  <h2>Unordered List</h2>
  <ul>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ul>

  <h2>Ordered List</h2>
  <ol>
    <li>สร้างไฟล์ index.html</li>
    <li>เขียนโค้ด</li>
    <li>เปิดด้วยเบราว์เซอร์</li>
  </ol>

  <h2>Links and Image</h2>
  <p><a href="https://www.example.com" target="_blank">เปิดเว็บไซต์ตัวอย่าง</a></p>
  <img src="https://via.placeholder.com/240x140" alt="รูปภาพตัวอย่าง" width="240" height="140">
</body>
</html>
