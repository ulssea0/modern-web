<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Structure and Semantic Tags</title>
</head>
<body>
  <header>
    <h1>My Portfolio</h1>
    <nav>
      <a href="#home">หน้าแรก</a> |
      <a href="#about">เกี่ยวกับฉัน</a> |
      <a href="#contact">ติดต่อ</a>
    </nav>
  </header>

  <main>
    <section id="home">
      <h2>หน้าแรก</h2>
      <p>ตัวอย่างการใช้ <strong>Semantic HTML</strong> เพื่อจัดโครงสร้างเว็บเพจ</p>
    </section>

    <section id="about">
      <h2>เกี่ยวกับฉัน</h2>
      <article>
        <h3>บทความตัวอย่าง</h3>
        <p>แท็ก <mark>article</mark> ใช้สำหรับเนื้อหาที่สามารถแยกออกมาได้</p>
      </article>
      <aside>ข้อมูลเพิ่มเติมอยู่ในแท็ก aside</aside>
    </section>
  </main>

  <footer id="contact">
    <p>ติดต่อ: student@example.com</p>
  </footer>
</body>
</html>
